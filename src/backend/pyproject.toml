[project]
name = "pathpilot-backend"
version = "0.1.0"
description = "PathPilot AI backend — FastAPI + LangChain/LangGraph + ChromaDB + Ollama"
requires-python = "==3.11.7"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7.4",
  "langchain>=0.3",
  "langchain-community>=0.3",
  "langchain-ollama>=0.2",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "pypdf>=4.3",
  "tiktoken>=0.7",
  # Persistence
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "email-validator>=2.2",
  # Resume export (Phase 3)
  "python-docx>=1.1",
  "weasyprint>=62.3",
  "odfpy>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
